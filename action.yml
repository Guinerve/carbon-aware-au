name: carbon-aware-au
description: Wait until the emissions intensity of the grid in your NEM region is below a threshold, then go on with the job.
inputs:
  region:
    description: NEM region (NSW1, QLD1, VIC1, SA1 or TAS1)
    required: true
  below:
    description: Threshold in g CO2e/kWh
    required: true
  max-wait:
    description: Longest time to wait, for example 90m or 6h
    default: 3h
  on-timeout:
    description: "At the deadline: run continues the job (default), fail stops it"
    default: run
  on-unavailable:
    description: "If grid data cannot be read: run continues the job (default), fail stops it"
    default: run
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5
    - shell: bash
      working-directory: ${{ github.action_path }}
      # Inputs go through env, not into the script text, so an input value cannot inject shell code.
      env:
        CAA_REGION: ${{ inputs.region }}
        CAA_BELOW: ${{ inputs.below }}
        CAA_MAX_WAIT: ${{ inputs.max-wait }}
        CAA_ON_TIMEOUT: ${{ inputs.on-timeout }}
        CAA_ON_UNAVAILABLE: ${{ inputs.on-unavailable }}
      run: >-
        uv run --locked carbon-aware-au wait
        --region "$CAA_REGION" --below "$CAA_BELOW" --max-wait "$CAA_MAX_WAIT"
        --on-timeout "$CAA_ON_TIMEOUT" --on-unavailable "$CAA_ON_UNAVAILABLE"
