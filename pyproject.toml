[project]
name = "carbon-aware-au"
version = "0.1.0"
description = "Run your jobs when the Australian grid is cleanest: delay a command until NEM emissions intensity in your region drops below a threshold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["nem-mcp", "pandas>=2.2", "httpx>=0.27"]

[project.optional-dependencies]
chart = ["matplotlib>=3.8"]

[project.scripts]
carbon-aware-au = "carbon_aware_au.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[tool.uv.sources]
nem-mcp = { git = "https://github.com/Guinerve/nem-mcp", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carbon_aware_au"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
